name: Release

# A `v*` tag builds the macOS binaries and publishes them as a GitHub
# release. Run it by hand to build the archives without publishing, as a
# dry run before tagging.
#
# Asset names carry no version, so
# https://github.com/turchenkoalex/martty/releases/latest/download/<asset>
# always points at the newest release and the site never has to change.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # An arm64 runner; x86_64 is cross-compiled (Apple clang builds the
    # Oniguruma C code for either arch).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # arm64 macOS kills unsigned binaries. The linker signs arm64 ad hoc
      # but leaves x86_64 unsigned, so sign both here (`--force` replaces the
      # linker's signature) and check it, so a toolchain change can't ship a
      # binary that won't start. Ad hoc isn't a Developer ID: a file
      # downloaded with a browser still needs its quarantine flag removed.
      - name: Sign ad hoc
        run: |
          bin=target/${{ matrix.target }}/release/martty
          codesign --force --sign - "$bin"
          codesign --verify --verbose "$bin"

      - name: Smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          bin=target/${{ matrix.target }}/release/martty
          "$bin" --help
          "$bin" --version
          printf '# Hello\n\n- one\n- two\n' | MARTTY_NO_COLOR=1 "$bin" -P --width 40

      - name: Package
        run: |
          name=martty-${{ matrix.target }}
          mkdir -p dist "$name"
          cp target/${{ matrix.target }}/release/martty LICENSE README.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: martty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "martty ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
