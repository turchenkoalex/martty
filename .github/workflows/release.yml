name: Release

# A `v*` tag builds the macOS and Linux binaries and publishes them as a
# GitHub release. Run it by hand to build the archives without publishing, as a
# dry run before tagging.
#
# Asset names carry no version, so
# https://github.com/turchenkoalex/martty/releases/latest/download/<asset>
# always points at the newest release and the site never has to change.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Intel Macs are no longer sold.
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Static musl binaries run on any distribution, whatever its glibc.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      # Oniguruma and ring (rustls) are C, compiled against musl.
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # arm64 macOS kills unsigned binaries. The linker signs ad hoc; sign
      # again anyway (`--force` replaces its signature) and check, so a
      # toolchain change can't ship a binary that won't start. Ad hoc isn't a
      # Developer ID: a file downloaded with a browser still needs its
      # quarantine flag removed.
      - name: Sign ad hoc
        if: runner.os == 'macOS'
        run: |
          bin=target/${{ matrix.target }}/release/martty
          codesign --force --sign - "$bin"
          codesign --verify --verbose "$bin"

      # Every binary is built on the system it runs on.
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/martty
          "$bin" --help
          "$bin" --version
          printf '# Hello\n\n- one\n- two\n' | MARTTY_NO_COLOR=1 "$bin" -P --width 40

      - name: Package
        run: |
          name=martty-${{ matrix.target }}
          mkdir -p dist "$name"
          cp target/${{ matrix.target }}/release/martty LICENSE README.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: martty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  # Points the formula in turchenkoalex/homebrew-tap at the new archives.
  # Pushing there needs a token with write access to that repository in the
  # HOMEBREW_TAP_TOKEN secret; without it the tap keeps the old formula.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Update the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew formula wasn't updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:$TAP_TOKEN@github.com/turchenkoalex/homebrew-tap.git" tap
          .github/homebrew-formula.sh "$version" dist > tap/Formula/martty.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "martty $version"
          git push
