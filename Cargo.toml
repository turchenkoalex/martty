[package]
name = "martty"
version = "0.1.9"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[dependencies]
fontdue = "0.9.5"
gif = "0.14.1"
image-webp = "0.2.4"
latex-rust = "3.0.3"
libc = "0.2.191"
merman = { version = "0.11.0", default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-pie", "diagram-gantt", "diagram-journey", "diagram-git-graph", "diagram-timeline", "diagram-xychart", "diagram-quadrant-chart", "diagram-requirement"] }
miniz_oxide = "0.9.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde_json = "1.0.154"
# Oniguruma, not fancy-regex: compiling a grammar on first use is ~7× faster.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
unicode-width = "0.2.3"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zune-jpeg = "0.5.9"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
too_many_lines = "warn"

[profile.release]
lto = true
strip = true

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
