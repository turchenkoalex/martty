<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>martty changelog</title>
<meta name="description" content="What changed in each release of martty, the Markdown viewer for Ghostty.">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101015" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316161e'/%3E%3Cpath d='M8 22V10l5 6 5-6v12' fill='none' stroke='%23f5a97f' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M21 22h4' stroke='%238aadf4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --bg-2: #efece4;
  --fg: #1d1b22;
  --muted: #5f5b68;
  --line: #dcd7cc;
  --card: #ffffff;
  --accent: #c2410c;
  --accent-2: #2f55c8;
  --term-bg: #fbfaf7;
  --term-fg: #2a2733;
  --term-dim: #8a8494;
  --term-bar: #ece8df;
  --term-code: #f0ece3;
  --t-red: #c0392b;
  --t-green: #3c8a3f;
  --t-yellow: #a8710a;
  --t-blue: #2f55c8;
  --t-magenta: #8e44ad;
  --t-cyan: #17808f;
  --shadow: 0 30px 60px -20px rgba(40, 30, 10, .25), 0 0 0 1px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101015;
    --bg-2: #16161e;
    --fg: #e8e6ef;
    --muted: #9c98aa;
    --line: #2a2935;
    --card: #17171f;
    --accent: #f5a97f;
    --accent-2: #8aadf4;
    --term-bg: #1a1b26;
    --term-fg: #c8cbe0;
    --term-dim: #6b6f8a;
    --term-bar: #14141c;
    --term-code: #232433;
    --t-red: #f7768e;
    --t-green: #9ece6a;
    --t-yellow: #e0af68;
    --t-blue: #7aa2f7;
    --t-magenta: #bb9af7;
    --t-cyan: #7dcfff;
    --shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101015;
  --bg-2: #16161e;
  --fg: #e8e6ef;
  --muted: #9c98aa;
  --line: #2a2935;
  --card: #17171f;
  --accent: #f5a97f;
  --accent-2: #8aadf4;
  --term-bg: #1a1b26;
  --term-fg: #c8cbe0;
  --term-dim: #6b6f8a;
  --term-bar: #14141c;
  --term-code: #232433;
  --t-red: #f7768e;
  --t-green: #9ece6a;
  --t-yellow: #e0af68;
  --t-blue: #7aa2f7;
  --t-magenta: #bb9af7;
  --t-cyan: #7dcfff;
  --shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
a { color: inherit; }
code, pre { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 32px; } }

nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
.logo { display: flex; align-items: center; gap: 10px; font: 800 20px/1 "JetBrains Mono", monospace; text-decoration: none; letter-spacing: -.02em; }
.logo svg { width: 28px; height: 28px; }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-links a, .icon-btn {
  font-size: 14px; color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 8px;
  background: none; border: 0; cursor: pointer; font-family: inherit;
}
.nav-links a:hover, .icon-btn:hover { color: var(--fg); background: var(--bg-2); }
.icon-btn { display: inline-flex; align-items: center; padding: 8px; }
.icon-btn svg { width: 18px; height: 18px; }
@media (max-width: 560px) { .nav-links .hide-sm { display: none; } }

main { max-width: 760px; padding: 48px 0 0; }
.kicker { font: 600 13px/1 "JetBrains Mono", monospace; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }
h1 { font: 800 clamp(32px, 5vw, 52px)/1.1 "JetBrains Mono", monospace; letter-spacing: -.04em; margin: 14px 0; }
.sub { color: var(--muted); font-size: 17px; margin: 0 0 24px; }

.release { border-top: 1px solid var(--line); padding: 36px 0 8px; scroll-margin-top: 16px; }
.release h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 8px;
  font: 800 28px/1.2 "JetBrains Mono", monospace; letter-spacing: -.03em; }
.release h2 a { text-decoration: none; }
.release h2 time { font: 400 14px/1 "JetBrains Mono", monospace; color: var(--muted); letter-spacing: 0; }
.release h2 .diff { margin-left: auto; font: 500 14px/1 Inter, sans-serif; color: var(--muted); letter-spacing: 0; }
.release h2 .diff:hover { color: var(--fg); }
.release h3 { font: 600 13px/1 "JetBrains Mono", monospace; color: var(--accent); text-transform: uppercase;
  letter-spacing: .1em; margin: 26px 0 10px; }
.release p { margin: 12px 0; }
.release ul { margin: 0; padding-left: 22px; }
.release li { margin: 8px 0; }
.release li::marker { color: var(--muted); }
.release li ul { margin-top: 6px; }
.release a:not(h2 a) { color: var(--accent-2); text-underline-offset: 2px; }
main code { font-size: .88em; background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.release pre { background: var(--bg-2); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 14px; }
.release pre code { background: none; border: 0; padding: 0; }

footer { margin-top: 96px; border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }
footer a { color: var(--muted); }
footer a:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#16161e"/><path d="M8 22V10l5 6 5-6v12" fill="none" stroke="#f5a97f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 22h4" stroke="#8aadf4" stroke-width="3" stroke-linecap="round"/></svg>
      martty
    </a>
    <div class="nav-links">
      <a class="hide-sm" href="./#features">Features</a>
      <a class="hide-sm" href="./#how">How it works</a>
      <a class="hide-sm" href="./#install">Install</a>
      <button class="icon-btn" id="theme" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/turchenkoalex/martty" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>
    </div>
  </nav>

  <main>
    <div class="kicker">Changelog</div>
    <h1>What changed, release by release.</h1>
    <p class="sub">Newest first. Binaries for every version are on the <a href="https://github.com/turchenkoalex/martty/releases">releases page</a>; <code>brew upgrade martty</code> gets the latest.</p>
<!-- changelog -->
  </main>
</div>

<footer>
  <div class="wrap">
    <span>martty · Apache-2.0 · JetBrains Mono bundled under the SIL OFL</span>
    <span><a href="./">Home</a> · <a href="https://github.com/turchenkoalex/martty">GitHub</a> · <a href="https://ghostty.org">Ghostty</a></span>
  </div>
</footer>

<script>
(() => {
  const root = document.documentElement;
  const KEY = "martty-theme";
  try { const t = localStorage.getItem(KEY); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY, root.dataset.theme); } catch (e) {}
  });
})();
</script>
</body>
</html>
